<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021E2D" />
      <stop offset="100%" stop-color="#074D6E" />
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-1)" rx="24" />

  <!-- Abstract Grid/Waves in background -->
  <g opacity="0.1" stroke="#00F2FE" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="450" />
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="350" y1="0" x2="350" y2="450" />
    <line x1="450" y1="0" x2="450" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="650" y1="0" x2="650" y2="450" />
    <ellipse cx="600" cy="225" rx="300" ry="300" fill="none" stroke-width="1.5" />
    <ellipse cx="600" cy="225" rx="200" ry="200" fill="none" stroke-width="1.5" />
  </g>

  <!-- Left Side: Mockup Tablet Frame of the Audio Program -->
  <g transform="translate(80, 50)" filter="drop-shadow(0px 15px 25px rgba(0,0,0,0.45))">
    <!-- Outer tablet bezel -->
    <rect x="0" y="0" width="220" height="340" rx="20" fill="#0A0F14" stroke="#4FACFE" stroke-width="2.5" />
    <!-- Screen -->
    <rect x="10" y="10" width="200" height="320" rx="14" fill="#03111A" />
    
    <!-- Cover graphic within tablet -->
    <rect x="18" y="20" width="184" height="160" rx="8" fill="#062235" />
    
    <!-- Headphone Vector Inside Tablet cover -->
    <g transform="translate(110, 85)" stroke="#00F2FE" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M -30 15 A 32 32 0 0 1 30 15" />
      <rect x="-36" y="10" width="10" height="18" rx="3" fill="#00F2FE" stroke="none" />
      <rect x="26" y="10" width="10" height="18" rx="3" fill="#00F2FE" stroke="none" />
      <path d="M -31 20 L -31 28 AM -31 24 C -15 36, 15 36, 31 24" stroke-width="1.5" stroke-dasharray="2,2" />
    </g>
    <!-- Live Wave inside tablet cover -->
    <path d="M 40 150 Q 60 130 80 150 T 120 150 T 160 150" fill="none" stroke="#4FACFE" stroke-width="2" />

    <!-- Details on tablet screen -->
    <text x="110" y="210" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">BONUS AUDIOS</text>
    <text x="110" y="232" fill="#88A0B0" font-family="'Inter', sans-serif" font-weight="700" font-size="9" text-anchor="middle" letter-spacing="2">CALME IMMÉDIAT</text>
    
    <!-- Big Play circle inside tablet screen -->
    <circle cx="110" cy="275" r="22" fill="#00F2FE" opacity="0.15" />
    <circle cx="110" cy="275" r="16" fill="url(#neon-glow)" />
    <polygon points="106,267 118,275 106,283" fill="#0A0F14" />
  </g>

  <!-- Right Side: Beautiful Explanatory Graphics -->
  <!-- Gorgeous Soundwaves and Neon Glowing pulse -->
  <g transform="translate(380, 210)" filter="url(#glow-effect)">
    <!-- Harmonic Audio waves -->
    <path d="M 40 -80 C 80 -150 140 -120 180 -140 Q 220 -160 260 -70" fill="none" stroke="#00F2FE" stroke-width="4" stroke-linecap="round" opacity="0.65" />
    <path d="M 10 -40 C 60 -100 120 -50 160 -90 Q 200 -130 290 -20" fill="none" stroke="#4FACFE" stroke-width="5" stroke-linecap="round" />
    <path d="M 30 10 C 90 -40 140 30 200 -30 Q 250 -80 310 30" fill="none" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Floating Audio Wave Nodes -->
  <circle cx="430" cy="330" r="4" fill="#00F2FE" filter="url(#glow-effect)" />
  <circle cx="560" cy="80" r="7" fill="#4FACFE" filter="url(#glow-effect)" />
  <circle cx="680" cy="180" r="3" fill="#00F2FE" />

  <!-- Labels -->
  <g transform="translate(380, 80)">
    <rect x="0" y="0" width="105" height="26" rx="13" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-width="1" />
    <text x="52.5" y="17" fill="#00F2FE" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="9" text-anchor="middle" letter-spacing="1">AUDIO FLAC 320K</text>
  </g>

  <g transform="translate(380, 130)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="28" letter-spacing="1">CADEAU #1</text>
    <text x="0" y="32" fill="url(#neon-glow)" font-family="'Inter', sans-serif" font-weight="900" font-size="20">SESSIONS CALME RAPIDE</text>
    <text x="0" y="60" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="700" font-size="12" opacity="0.8">5 minutes chrono pour stopper net le surmenage mental.</text>
  </g>

  <!-- Live timer badge logo -->
  <g transform="translate(380, 240)">
    <text x="0" y="44" fill="#00F2FE" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="44" filter="url(#glow-effect)">05:00</text>
    <text x="140" y="40" fill="#88A0B0" font-family="'Inter', sans-serif" font-weight="700" font-size="11" letter-spacing="1">ACTIVATE RECOVERY<tspan x="140" dy="16">NEURAL SYSTEM</tspan></text>
  </g>
</svg>
