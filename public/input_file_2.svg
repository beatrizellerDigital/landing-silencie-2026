<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C15" />
      <stop offset="100%" stop-color="#0F5C45" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="soft-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#010A08" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-3)" rx="24" />

  <!-- Abstract concentric background waves representing mindfulness resonance -->
  <g opacity="0.08" stroke="#10B981" stroke-width="1.2">
    <ellipse cx="650" cy="100" rx="100" ry="100" fill="none" />
    <ellipse cx="650" cy="100" rx="180" ry="180" fill="none" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="250" x2="800" y2="250" />
  </g>

  <!-- Left Side: Book Cover Mockup representation -->
  <g transform="translate(100, 50)" filter="url(#soft-depth)">
    <!-- Book spine / shadow -->
    <rect x="-8" y="10" width="10" height="320" rx="4" fill="#021F17" />
    <!-- Book Cover front page -->
    <rect x="0" y="6" width="200" height="328" rx="8" fill="#113F32" stroke="#46AC94" stroke-width="2.5" />
    <!-- Elegant gold/emerald inner inlay trim -->
    <rect x="10" y="16" width="180" height="308" rx="5" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Abstract emblem on book cover -->
    <g transform="translate(100, 105)">
      <!-- Concentric rings of meditation -->
      <circle cx="0" cy="0" r="35" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
      <circle cx="0" cy="0" r="24" fill="none" stroke="#34D399" stroke-width="1.5" />
      <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.3" />
      
      <!-- Serene leaf motif in center of logo inside book cover -->
      <path d="M 0 -12 Q -12 0 0 12 Q 12 0 0 -12" fill="#10B981" />
      <line x1="0" y1="10" x2="0" y2="-10" stroke="#113F32" stroke-width="1.2" />
    </g>

    <!-- Book text titles -->
    <text x="100" y="195" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="3.5">MÉDITATIONS</text>
    <text x="100" y="215" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="11" text-anchor="middle" letter-spacing="3.5">GUIDÉES</text>
    <text x="100" y="240" fill="#34D399" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="8" text-anchor="middle" letter-spacing="1.5">ANTI-SURPENSÉE</text>
    <text x="100" y="285" fill="#78AF9F" font-family="'Inter', sans-serif" font-weight="500" font-size="7" text-anchor="middle">REPROGRAMMATION NEURONALE</text>
  </g>

  <!-- Right Side: Clean aesthetic typography -->
  <g transform="translate(390, 80)">
    <!-- Active state label badge -->
    <rect x="0" y="0" width="115" height="26" rx="13" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" />
    <text x="57.5" y="17" fill="#10B981" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="9" text-anchor="middle" letter-spacing="1">ZEN PLEINE CONSCIENCE</text>
    
    <!-- Premium text details -->
    <text x="0" y="65" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="28" letter-spacing="1">CADEAU #3</text>
    <text x="0" y="97" fill="url(#emerald-glow)" font-family="'Inter', sans-serif" font-weight="900" font-size="20">MÉDITATIONS ANTI-SURPENSÉE</text>
    <text x="0" y="125" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="700" font-size="12" opacity="0.8">Faites taire définitivement le brouhaha cérébral et la rumination nocturne.</text>
  </g>

  <!-- Interactive meditation timeline graphic (bottom right) -->
  <g transform="translate(390, 240)">
    <!-- Time dial plate/wheel background -->
    <circle cx="44" cy="44" r="36" fill="none" stroke="#10B981" stroke-width="2.5" opacity="0.3" />
    <path d="M 44 8 A 36 36 0 0 1 80 44" fill="none" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Stopwatch needle ticks -->
    <line x1="44" y1="44" x2="44" y2="20" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" />
    <line x1="44" y1="44" x2="62" y2="44" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <circle cx="44" cy="44" r="5" fill="#34D399" />
    
    <g transform="translate(110, 18)" font-family="'Inter', sans-serif" fill="#E2E8F0" font-weight="800" font-size="12">
      <text x="0" y="10">• Séance courte de 10 min basée sur l'imagerie somatique</text>
      <text x="0" y="32">• Dissoudre les schémas obsessionnels de pensée répétitive</text>
    </g>
  </g>
</svg>
