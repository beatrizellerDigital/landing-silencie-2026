<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111B24" />
      <stop offset="100%" stop-color="#213E4A" />
    </linearGradient>
    <linearGradient id="coral-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5F6D" />
      <stop offset="100%" stop-color="#FFC371" />
    </linearGradient>
    <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-2)" rx="24" />

  <!-- Technical grid pattern overlay -->
  <g opacity="0.08" stroke="#FF5F6D" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <circle cx="200" cy="225" r="155" fill="none" stroke-width="1.5" />
    <circle cx="200" cy="225" r="240" fill="none" stroke-width="1" />
  </g>

  <!-- Left Side: Sleek printed card mockup layout -->
  <g transform="translate(90, 50)" filter="url(#shadow-blur)">
    <!-- Main cardboard clipboard backdrop -->
    <rect x="0" y="0" width="210" height="340" rx="12" fill="#E6EEF4" stroke="#FFF" stroke-width="3" />
    <!-- Metal Clip at the top -->
    <rect x="65" y="-8" width="80" height="28" rx="6" fill="#A0B3C1" />
    <rect x="85" y="-3" width="40" height="10" rx="2" fill="#718898" />
    <circle cx="105" cy="12" r="3" fill="#4B5F6C" />

    <!-- Protocol sheet content -->
    <g transform="translate(18, 45)">
      <!-- Document header -->
      <text x="0" y="15" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#C23B3B" letter-spacing="1.5">PROTOCOLE CLASSIFIÉ</text>
      <text x="0" y="32" font-family="'Inter', sans-serif" font-weight="900" font-size="15" fill="#1B2B35">URGENCE PANIQUE</text>
      <!-- Horizontal divider -->
      <line x1="0" y1="42" x2="174" y2="42" stroke="#BDC9D3" stroke-width="2" />

      <!-- Step List -->
      <!-- Step 1 -->
      <g transform="translate(0, 58)">
        <circle cx="10" cy="10" r="10" fill="#FF5F6D" />
        <text x="10" y="14" font-family="'Inter', sans-serif" font-weight="900" font-size="10" fill="#FFF" text-anchor="middle">1</text>
        <text x="28" y="10" font-family="'Inter', sans-serif" font-weight="900" font-size="8" fill="#5F717C">MOUVEMENT INVERSE</text>
        <rect x="28" y="14" width="130" height="4" rx="2" fill="#BDC9D3" opacity="0.6" />
        <rect x="28" y="21" width="90" height="4" rx="2" fill="#BDC9D3" opacity="0.4" />
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 115)">
        <circle cx="10" cy="10" r="10" fill="#FF8C37" />
        <text x="10" y="14" font-family="'Inter', sans-serif" font-weight="900" font-size="10" fill="#FFF" text-anchor="middle">2</text>
        <text x="28" y="10" font-family="'Inter', sans-serif" font-weight="900" font-size="8" fill="#5F717C">RECALIBRAGE PHYSIQUE</text>
        <rect x="28" y="14" width="120" height="4" rx="2" fill="#BDC9D3" opacity="0.6" />
        <rect x="28" y="21" width="110" height="4" rx="2" fill="#BDC9D3" opacity="0.4" />
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 172)">
        <circle cx="10" cy="10" r="10" fill="#FFC371" />
        <text x="10" y="14" font-family="'Inter', sans-serif" font-weight="900" font-size="10" fill="#FFF" text-anchor="middle">3</text>
        <text x="28" y="10" font-family="'Inter', sans-serif" font-weight="900" font-size="8" fill="#5F717C">VERROUILLAGE VAGAL</text>
        <rect x="28" y="14" width="140" height="4" rx="2" fill="#BDC9D3" opacity="0.6" />
        <rect x="28" y="21" width="70" height="4" rx="2" fill="#BDC9D3" opacity="0.4" />
      </g>

      <!-- Bottom warning logo -->
      <path d="M 12 250 L 22 232 L 2 232 Z" fill="#FF5F6D" />
      <rect x="11" y="236" width="2" height="5" fill="#FFEFEF" />
      <circle cx="12" cy="245" r="1.2" fill="#FFEFEF" />
      <text x="30" y="244" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="8" fill="#71838F" letter-spacing="0.5">FICHE REFLEXE CLASSIQUE</text>
    </g>
  </g>

  <!-- Right Side: Bold Typography & Emergency indicator -->
  <g transform="translate(420, 80)">
    <!-- Red Alert Badge -->
    <rect x="0" y="0" width="125" height="26" rx="13" fill="#FF5F6D" fill-opacity="0.15" stroke="#FF5F6D" stroke-width="1.2" />
    <text x="62.5" y="17" fill="#FF5F6D" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="9" text-anchor="middle" letter-spacing="1">REPONSE DE SECOURS</text>
    
    <!-- Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="28" letter-spacing="1">CADEAU #2</text>
    <text x="0" y="97" fill="url(#coral-glow)" font-family="'Inter', sans-serif" font-weight="900" font-size="20">FICHE PROTOCOLE D'URGENCE</text>
    <text x="0" y="125" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="700" font-size="12" opacity="0.8">Le guide d'action immédiate à regarder en cas de crise imminente.</text>
  </g>

  <!-- Big circular pulse graphic with checkmarks -->
  <g transform="translate(420, 250)">
    <!-- Background pulse wave rings -->
    <circle cx="34" cy="34" r="54" fill="none" stroke="#FF5F6D" stroke-width="1" opacity="0.1" />
    <circle cx="34" cy="34" r="44" fill="none" stroke="#FF5F6D" stroke-width="1" opacity="0.25" />
    <circle cx="34" cy="34" r="34" fill="url(#coral-glow)" opacity="0.9" />
    
    <!-- Dynamic Check icon -->
    <path d="M 22 34 L 30 42 L 48 24" fill="none" stroke="#111B24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Technical text list next to the badge -->
    <g transform="translate(110, 10)" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#E2E8F0">
      <text x="0" y="10">• Bloquer l'hyperventilation réactive en 12 secondes</text>
      <text x="0" y="32">• Actionner le frein moteur ralentisseur cardiaque</text>
    </g>
  </g>
</svg>
